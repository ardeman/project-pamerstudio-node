# Deploys Pamer Studio on the web (web/: Hosting, Firestore and Storage rules)
# when it changes on main. Signs in to Google Cloud without a stored key
# (Workload Identity Federation, set up once by web/setup-ci.sh).
name: Deploy web

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1095331486954/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@pamer-studio.iam.gserviceaccount.com
      - run: npx -y firebase-tools@15.34.2 deploy --project pamer-studio --non-interactive
