<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Krida · launch motion</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: "SF Pro Rounded", "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at 35% 25%, #F7D7B5 0%, #E39A5C 100%);
    }
    #stage { position: absolute; inset: 0; }
    #world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
    #card {
      position: absolute; left: 0; top: 0; box-sizing: border-box;
      background: #FFF7EC; color: #2B211A;
      overflow: hidden;
      box-shadow: 0 22px 48px rgba(43, 33, 26, 0.22);
    }
    #shots { position: absolute; inset: 0; }
    #shots img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center;
      opacity: 0; pointer-events: none;
    }
    #label {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px;
      pointer-events: none; text-align: center;
      padding: 18px 28px 22px;
      font-weight: 800; letter-spacing: -0.02em;
      background: linear-gradient(transparent, rgba(27, 22, 18, 0.55));
      color: #FFF7EC;
    }
    #label.solid {
      inset: 0; background: transparent; color: #2B211A;
      padding: 24px;
    }
    #label .sub { font-weight: 600; opacity: 0.85; font-size: 0.42em; letter-spacing: 0; }
    #cursor {
      position: absolute; width: 22px; height: 22px; margin: -2px 0 0 -2px;
      pointer-events: none; z-index: 5; transform-origin: 4px 2px;
    }
    #cursor svg { display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
    #ripple {
      position: absolute; border-radius: 50%;
      border: 2px solid rgba(43, 33, 26, 0.35);
      pointer-events: none; z-index: 4; transform: translate(-50%, -50%);
    }
    #hud {
      position: absolute; left: 0; right: 0; bottom: 56px;
      text-align: center; color: #2B211A; font-weight: 800;
      font-size: 30px; letter-spacing: 0.1em; opacity: 0;
    }
    #tag {
      position: absolute; left: 0; right: 0; bottom: 100px;
      text-align: center; color: #2B211A; font-weight: 600;
      font-size: 22px; opacity: 0;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="world">
      <div id="card">
        <div id="shots">
          <img data-shot="lobby" alt="" />
          <img data-shot="board" alt="" />
          <img data-shot="emotes" alt="" />
          <img data-shot="match" alt="" />
        </div>
        <div id="label"></div>
      </div>
    </div>
    <div id="ripple" aria-hidden="true"></div>
    <div id="cursor" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24">
        <path fill="#1B1612" stroke="#FFF7EC" stroke-width="1.2"
          d="M4 3l11 7.2-4.6 1.4L13 20 9.8 12.2 4 10.8z"/>
      </svg>
    </div>
    <div id="hud">KRIDA</div>
    <div id="tag"></div>
  </div>
  <script>
    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
    function stepR(tau, { w, z }) {
      if (tau <= 0) return 0
      if (z >= 1) { const x = w * tau; return 1 - Math.exp(-x) * (1 + x) }
      const wd = w * Math.sqrt(1 - z * z)
      return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau))
    }
    class Track {
      constructor(v0) { this.v0 = v0; this.cur = v0; this.ev = [] }
      to(t, v, sp) {
        if (v !== this.cur) { this.ev.push([t, v - this.cur, sp]); this.cur = v }
        return this
      }
      at(t) {
        let v = this.v0
        for (const [ti, d, sp] of this.ev) v += d * stepR(t - ti, sp)
        return v
      }
    }
    function vis(t, tin, tout, dOut = 0.14) {
      const e = stepR(t - tin, { w: 26, z: 1 })
      const x = tout == null ? 0 : clamp((t - tout) / dOut)
      const xo = x * x
      return { o: e * (1 - xo), b: (1 - e) * 10 + xo * 10, dy: (1 - e) * 16 - xo * 10, e }
    }

    // 120 BPM, 24 beats = 12 s. Real app captures inside one morphing card.
    // DECISION: Play → lobby Start → congklak board → emotes → match → wordmark → tagline → loop
    const PERIOD = 0.5
    const DURATION = 12
    const B = (n) => n * PERIOD
    // Capture aspect ~ 2622×1206
    const SCREEN_W = 960
    const SCREEN_H = Math.round(SCREEN_W * 1206 / 2622)

    const copy = {
      en: {
        play: 'Play',
        lobby: 'Congklak',
        lobbySub: 'Start on this phone',
        board: 'On the board',
        boardSub: 'sow into the holes',
        emotes: 'Send an emote',
        match: 'Find a match',
        tag: 'Congklak with friends',
      },
      id: {
        play: 'Mainkan',
        lobby: 'Congklak',
        lobbySub: 'Mulai di HP ini',
        board: 'Di papan',
        boardSub: 'tabur ke lubang',
        emotes: 'Kirim emote',
        match: 'Cari lawan',
        tag: 'Congklak bareng teman',
      },
    }
    let lang = new URLSearchParams(location.search).get('lang') === 'id' ? 'id' : 'en'

    const sp = { w: 20, z: 0.85 }
    const spSoft = { w: 15, z: 0.9 }
    const spCam = { w: 10, z: 1 }
    const spPress = { w: 40, z: 1 }

    const T = {
      w: new Track(280), h: new Track(88), r: new Track(44),
      press: new Track(1), z: new Track(1),
      mx: new Track(48), my: new Track(130),
      hud: new Track(0), tag: new Track(0),
    }

    // Morph: pill → landscape screen → slim bar → pill
    T.w.to(B(1) - 0.14, 264, sp)
      .to(B(2) - 0.3, SCREEN_W, sp)
      .to(B(16) - 0.25, 220, sp)
      .to(B(20) - 0.2, 300, sp)
      .to(B(22) - 0.18, 280, sp)
    T.h.to(B(1) - 0.14, 80, sp)
      .to(B(2) - 0.3, SCREEN_H, sp)
      .to(B(16) - 0.25, 72, sp)
      .to(B(20) - 0.2, 110, sp)
      .to(B(22) - 0.18, 88, sp)
    T.r.to(B(1) - 0.14, 40, sp)
      .to(B(2) - 0.3, 28, sp)
      .to(B(16) - 0.25, 20, sp)
      .to(B(20) - 0.2, 28, sp)
      .to(B(22) - 0.18, 44, sp)
    T.press.to(B(1), 0.9, spPress).to(B(1) + 0.14, 1, { w: 28, z: 1 })
      .to(B(3.2), 0.94, spPress).to(B(3.2) + 0.12, 1, { w: 28, z: 1 })
    T.z.to(B(2) - 0.2, 1.02, spCam).to(B(8) - 0.2, 1.06, spCam)
      .to(B(14) - 0.18, 1.0, spCam).to(B(16) - 0.14, 0.92, spCam)
      .to(B(20) - 0.14, 1.0, spCam).to(B(22) - 0.12, 1, spCam)
    T.mx.to(B(1) - 0.06, 10, spSoft).to(B(1) + 0.1, 10, spSoft)
      .to(B(3) - 0.1, 180, spSoft).to(B(3.4), 180, spSoft)
      .to(B(6) - 0.12, -40, spSoft).to(B(10) - 0.12, 120, spSoft)
      .to(B(13) - 0.12, 200, spSoft).to(B(16) - 0.12, 0, spSoft)
      .to(B(22) - 0.1, 48, spSoft)
    T.my.to(B(1) - 0.06, 22, spSoft).to(B(1) + 0.1, 22, spSoft)
      .to(B(3) - 0.1, 90, spSoft).to(B(3.4), 90, spSoft)
      .to(B(6) - 0.12, 40, spSoft).to(B(10) - 0.12, 70, spSoft)
      .to(B(13) - 0.12, 100, spSoft).to(B(16) - 0.12, 40, spSoft)
      .to(B(22) - 0.1, 130, spSoft)
    T.hud.to(B(16) - 0.16, 1, spCam).to(B(19.2), 1, spCam).to(B(20) - 0.1, 0, spCam)
    T.tag.to(B(18) - 0.12, 1, spCam).to(B(21), 1, spCam).to(B(22) - 0.1, 0, spCam)

    const card = document.getElementById('card')
    const label = document.getElementById('label')
    const world = document.getElementById('world')
    const cursor = document.getElementById('cursor')
    const ripple = document.getElementById('ripple')
    const hud = document.getElementById('hud')
    const tag = document.getElementById('tag')
    const stage = document.getElementById('stage')
    const shotImgs = [...document.querySelectorAll('#shots img')]

    function shotUrl(name) {
      return new URL(`./shots/${lang}/${name}.png`, location.href).href
    }
    function loadShots() {
      for (const img of shotImgs) img.src = shotUrl(img.dataset.shot)
    }

    // Shot visibility windows (blur-swap).
    const SHOT_BEATS = [
      { name: 'lobby', tin: B(2) - 0.05, tout: B(5.5) },
      { name: 'board', tin: B(5.5) - 0.05, tout: B(10.5) },
      { name: 'emotes', tin: B(10.5) - 0.05, tout: B(13.5) },
      { name: 'match', tin: B(13.5) - 0.05, tout: B(15.8) },
    ]

    function caption(t) {
      const c = copy[lang]
      const beats = [
        { tin: -0.05, tout: B(1.6), html: c.play, solid: true },
        { tin: B(2.2), tout: B(5.2), html: `${c.lobby}<span class="sub">${c.lobbySub}</span>` },
        { tin: B(5.8), tout: B(10), html: `${c.board}<span class="sub">${c.boardSub}</span>` },
        { tin: B(10.8), tout: B(13.2), html: c.emotes },
        { tin: B(13.8), tout: B(15.5), html: c.match },
        { tin: B(22) - 0.08, tout: null, html: c.play, solid: true },
      ]
      let best = { o: 0, b: 10, dy: 0, html: '', solid: false }
      for (const b of beats) {
        const v = vis(t, b.tin, b.tout)
        if (v.o >= best.o) best = { ...v, html: b.html, solid: !!b.solid }
      }
      return best
    }

    window.setLang = (l) => {
      lang = l === 'id' ? 'id' : 'en'
      loadShots()
    }
    window.DURATION = DURATION
    window.CUES = [
      { at: B(1), sfx: 'tap' },
      { at: B(3.2), sfx: 'tap' },
      { at: B(5.5), sfx: 'sow' },
      { at: B(6.5), sfx: 'sow' },
      { at: B(7.5), sfx: 'sow' },
      { at: B(8.5), sfx: 'store' },
      { at: B(10.5), sfx: 'tap' },
      { at: B(13.5), sfx: 'turn' },
      { at: B(16), sfx: 'win' },
    ]

    loadShots()

    window.seek = (tRaw) => {
      const t = ((tRaw % DURATION) + DURATION) % DURATION
      const W = T.w.at(t) * T.press.at(t)
      const H = T.h.at(t) * T.press.at(t)
      const R = T.r.at(t)
      const z = T.z.at(t)
      const sw = stage.clientWidth || 1080
      const sh = stage.clientHeight || 1080
      const showingShot = t >= B(2) - 0.05 && t < B(15.9)

      world.style.transform = `translate(${sw / 2}px, ${sh / 2}px) scale(${z})`
      card.style.width = `${W}px`
      card.style.height = `${H}px`
      card.style.borderRadius = `${R}px`
      card.style.transform = `translate(${-W / 2}px, ${-H / 2}px)`
      card.style.background = showingShot ? '#1B1612' : '#FFF7EC'

      for (const img of shotImgs) {
        const win = SHOT_BEATS.find((s) => s.name === img.dataset.shot)
        if (!win) { img.style.opacity = '0'; continue }
        const v = vis(t, win.tin, win.tout)
        img.style.opacity = String(v.o)
        img.style.filter = `blur(${v.b}px)`
        img.style.transform = `translateY(${v.dy * 0.35}px)`
      }

      const c = caption(t)
      label.classList.toggle('solid', c.solid && !showingShot)
      label.innerHTML = c.html
      label.style.opacity = String(c.solid && showingShot ? 0 : c.o)
      label.style.filter = `blur(${c.b}px)`
      label.style.transform = `translateY(${c.dy}px)`
      label.style.fontSize = c.solid ? '36px' : '28px'

      const cx = sw / 2 + T.mx.at(t) * z
      const cy = sh / 2 + T.my.at(t) * z
      const pressAmt = 1 - T.press.at(t)
      cursor.style.left = `${cx}px`
      cursor.style.top = `${cy}px`
      cursor.style.transform = `scale(${1 - pressAmt * 1.6})`
      cursor.style.opacity = t >= B(16) - 0.05 && t < B(21.5) ? '0.1' : '1'

      const ripples = [B(1), B(3.2)]
      let rip = null
      for (const at of ripples) {
        const age = t - at
        if (age >= 0 && age < 0.4) { rip = age; break }
      }
      if (rip != null) {
        const u = rip / 0.4
        ripple.style.left = `${cx}px`
        ripple.style.top = `${cy}px`
        ripple.style.width = `${18 + u * 70}px`
        ripple.style.height = `${18 + u * 70}px`
        ripple.style.opacity = String(1 - u)
      } else ripple.style.opacity = '0'

      hud.style.opacity = String(T.hud.at(t))
      tag.textContent = copy[lang].tag
      tag.style.opacity = String(T.tag.at(t))
    }

    window.seek(0)
  </script>
</body>
</html>
