<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1114" media="(prefers-color-scheme: dark)">
  <title>Pamer Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e85d04'/%3E%3Cpath d='M12 9h6a5 5 0 0 1 0 10h-3v5h-3z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,550;9..144,650&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <div class="brand"><span class="mark">P</span><span class="brand-name">Pamer Studio</span></div>
    <span id="who"></span>
    <button id="signout" class="ghost" hidden>Sign out</button>
  </header>
  <main>
    <section id="signin" hidden>
      <div class="card signin-card">
        <span class="mark big">P</span>
        <h1>Pamer Studio</h1>
        <p>Marketing plans, campaign links, media and a shared dashboard for every project.</p>
        <button id="google" class="primary">Sign in with Google</button>
        <p id="denied" class="note" hidden>This account has no access.</p>
      </div>
    </section>
    <section id="app" hidden>
      <div class="app-shell">
        <aside class="app-aside" aria-label="Studio navigation">
          <div class="aside-section">
            <div class="aside-label">Shared</div>
            <nav id="shared-nav" class="aside-nav">
              <button type="button" data-shared="dashboard">Dashboard</button>
              <button type="button" data-shared="services">Services</button>
              <button type="button" data-shared="screenshots">Screenshots</button>
            </nav>
          </div>
          <div class="aside-section">
            <div class="aside-label">Projects</div>
            <nav id="projects" class="aside-nav"></nav>
            <button type="button" id="new-project" class="aside-add">+ Project</button>
          </div>
        </aside>
        <div class="app-main">
          <nav id="views" class="views scroll-fade" hidden>
            <div class="segmented">
              <button data-view="plan" class="on">Plan</button>
              <button data-view="posts">Posts</button>
              <button data-view="media">Media</button>
            </div>
            <div class="segmented">
              <button data-view="render">Render</button>
              <button data-view="ai">AI</button>
            </div>
          </nav>
          <div id="views-stage">
            <div id="plan" class="view-pane"></div>
            <div id="posts" class="view-pane" hidden></div>
            <div id="media" class="view-pane" hidden></div>
            <div id="render" class="view-pane" hidden></div>
            <div id="ai" class="view-pane" hidden></div>
            <div id="screenshots" class="view-pane" hidden></div>
            <div id="dashboard" class="view-pane" hidden></div>
            <div id="services" class="view-pane" hidden></div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
