<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Krida · launch motion pilot</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #E39A5C; overflow: hidden; }
    body { font-family: "SF Pro Display", "Segoe UI", system-ui, sans-serif; }
    #stage { position: absolute; inset: 0; }
    #world {
      position: absolute; left: 0; top: 0;
      width: 0; height: 0;
      transform-origin: 0 0;
    }
    #card {
      position: absolute; left: 0; top: 0;
      box-sizing: border-box;
      background: #FFF7EC;
      color: #2B211A;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(43, 33, 26, 0.18);
      will-change: auto; /* never will-change on camera-scaled nodes */
    }
    #label {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 10px;
      pointer-events: none;
      text-align: center;
      padding: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    #label .sub { font-weight: 500; opacity: 0.7; font-size: 0.42em; letter-spacing: 0; }
    #cursor {
      position: absolute; width: 22px; height: 22px; margin: -2px 0 0 -2px;
      pointer-events: none; z-index: 5;
    }
    #cursor svg { display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
    #hud {
      position: absolute; left: 0; right: 0; bottom: 48px;
      text-align: center; color: #2B211A; font-weight: 800;
      font-size: 28px; letter-spacing: 0.04em; opacity: 0;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="world">
      <div id="card"><div id="label"></div></div>
    </div>
    <div id="cursor" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24">
        <path fill="#1B1612" stroke="#FFF7EC" stroke-width="1.2"
          d="M4 3l11 7.2-4.6 1.4L13 20 9.8 12.2 4 10.8z"/>
      </svg>
    </div>
    <div id="hud">KRIDA</div>
  </div>
  <script>
    // Inline springs (same as shared/launch-motion/springs.mjs) so file:// works.
    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
    function stepR(tau, { w, z }) {
      if (tau <= 0) return 0
      if (z >= 1) { const x = w * tau; return 1 - Math.exp(-x) * (1 + x) }
      const wd = w * Math.sqrt(1 - z * z)
      return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau))
    }
    class Track {
      constructor(v0) { this.v0 = v0; this.cur = v0; this.ev = [] }
      to(t, v, sp) {
        if (v !== this.cur) { this.ev.push([t, v - this.cur, sp]); this.cur = v }
        return this
      }
      at(t) {
        let v = this.v0
        for (const [ti, d, sp] of this.ev) v += d * stepR(t - ti, sp)
        return v
      }
    }
    function vis(t, tin, tout, dOut = 0.12) {
      const e = stepR(t - tin, { w: 26, z: 1 })
      const x = tout == null ? 0 : clamp((t - tout) / dOut)
      const xo = x * x
      return { o: e * (1 - xo), b: (1 - e) * 10 + xo * 10, dy: (1 - e) * 16 - xo * 10, e }
    }

    // 120 BPM → 0.5 s per beat. 8 beats, loops.
    const PERIOD = 0.5
    const DURATION = 4
    const copy = {
      en: {
        play: 'Play',
        sow: 'Sow',
        hole: '7',
        store: 'Store',
        storeSub: 'your house',
        win: 'You win!',
      },
      id: {
        play: 'Mainkan',
        sow: 'Tabur',
        hole: '7',
        store: 'Rumah',
        storeSub: 'lubang besar',
        win: 'Kamu menang!',
      },
    }
    let lang = new URLSearchParams(location.search).get('lang') === 'id' ? 'id' : 'en'

    const sp = { w: 22, z: 0.82 }
    const spSoft = { w: 16, z: 0.9 }
    const spCam = { w: 10, z: 1 }

    // Card morph targets: x,y are world centre; w,h,r size/radius.
    const T = {
      x: new Track(0),
      y: new Track(0),
      w: new Track(280),
      h: new Track(88),
      r: new Track(44),
      press: new Track(1),
      cx: new Track(0),
      cy: new Track(0),
      z: new Track(1),
      mx: new Track(40),
      my: new Track(120),
      hud: new Track(0),
    }

    // Beat plan (DECISION: stylized congklak chrome, not app screenshots).
    // 0 play → 1 press → 2 sow → 3 hole → 4 store → 5 win toast → 6 wordmark → 7 reset toward play
    const B = (n) => n * PERIOD
    T.w.to(B(1) - 0.12, 260, sp).to(B(2) - 0.25, 200, sp).to(B(3) - 0.25, 160, sp)
      .to(B(4) - 0.25, 220, sp).to(B(5) - 0.25, 320, sp).to(B(6) - 0.2, 200, sp)
      .to(B(7) - 0.15, 280, sp)
    T.h.to(B(1) - 0.12, 80, sp).to(B(2) - 0.25, 200, sp).to(B(3) - 0.25, 160, sp)
      .to(B(4) - 0.25, 160, sp).to(B(5) - 0.25, 100, sp).to(B(6) - 0.2, 72, sp)
      .to(B(7) - 0.15, 88, sp)
    T.r.to(B(1) - 0.12, 40, sp).to(B(2) - 0.25, 36, sp).to(B(3) - 0.25, 80, sp)
      .to(B(4) - 0.25, 36, sp).to(B(5) - 0.25, 28, sp).to(B(6) - 0.2, 20, sp)
      .to(B(7) - 0.15, 44, sp)
    T.press.to(B(1), 0.92, { w: 40, z: 1 }).to(B(1) + 0.12, 1, { w: 28, z: 1 })
    T.z.to(B(2) - 0.2, 1.08, spCam).to(B(4) - 0.2, 1.0, spCam)
      .to(B(5) - 0.15, 1.12, spCam).to(B(6) - 0.1, 0.95, spCam).to(B(7) - 0.1, 1, spCam)
    T.mx.to(B(1) - 0.05, 8, spSoft).to(B(1) + 0.05, 8, spSoft)
      .to(B(2) - 0.1, -20, spSoft).to(B(3) - 0.1, 10, spSoft)
      .to(B(4) - 0.1, 30, spSoft).to(B(5) - 0.1, 0, spSoft)
      .to(B(6) - 0.1, 0, spSoft).to(B(7) - 0.05, 40, spSoft)
    T.my.to(B(1) - 0.05, 20, spSoft).to(B(1) + 0.05, 20, spSoft)
      .to(B(2) - 0.1, 10, spSoft).to(B(3) - 0.1, 30, spSoft)
      .to(B(4) - 0.1, 0, spSoft).to(B(5) - 0.1, -10, spSoft)
      .to(B(6) - 0.1, 40, spSoft).to(B(7) - 0.05, 120, spSoft)
    T.hud.to(B(6) - 0.15, 1, spCam).to(B(7) - 0.1, 0, spCam)

    const card = document.getElementById('card')
    const label = document.getElementById('label')
    const world = document.getElementById('world')
    const cursor = document.getElementById('cursor')
    const hud = document.getElementById('hud')
    const stage = document.getElementById('stage')

    function content(t) {
      const c = copy[lang]
      // Content windows: exit early so swaps don’t overlap.
      const beats = [
        { tin: -0.05, tout: B(1) - 0.05, html: c.play },
        { tin: B(2) - 0.05, tout: B(3) - 0.08, html: `${c.sow}<span class="sub">→</span>` },
        { tin: B(3) - 0.02, tout: B(4) - 0.08, html: c.hole },
        { tin: B(4) - 0.02, tout: B(5) - 0.08, html: `${c.store}<span class="sub">${c.storeSub}</span>` },
        { tin: B(5) - 0.02, tout: B(6) - 0.1, html: c.win },
        { tin: B(7) - 0.05, tout: null, html: c.play },
      ]
      let best = { o: 0, b: 10, dy: 0, html: '' }
      for (const b of beats) {
        const v = vis(t, b.tin, b.tout)
        if (v.o >= best.o) best = { ...v, html: b.html }
      }
      return best
    }

    window.setLang = (l) => { lang = l === 'id' ? 'id' : 'en' }
    window.DURATION = DURATION
    window.seek = (tRaw) => {
      // Loop-safe: wrap into [0, DURATION)
      let t = ((tRaw % DURATION) + DURATION) % DURATION
      const W = T.w.at(t) * T.press.at(t)
      const H = T.h.at(t) * T.press.at(t)
      const R = T.r.at(t)
      const z = T.z.at(t)
      const sw = stage.clientWidth || 1080
      const sh = stage.clientHeight || 1080

      world.style.transform = `translate(${sw / 2}px, ${sh / 2}px) scale(${z}) translate(${-T.cx.at(t)}px, ${-T.cy.at(t)}px)`
      card.style.width = `${W}px`
      card.style.height = `${H}px`
      card.style.borderRadius = `${R}px`
      card.style.transform = `translate(${-W / 2}px, ${-H / 2}px)`
      card.style.background = t >= B(5) - 0.05 && t < B(6) ? '#C9783A' : '#FFF7EC'
      card.style.color = t >= B(5) - 0.05 && t < B(6) ? '#FFF7EC' : '#2B211A'

      const c = content(t)
      label.innerHTML = c.html
      label.style.opacity = String(c.o)
      label.style.filter = `blur(${c.b}px)`
      label.style.transform = `translateY(${c.dy}px)`
      label.style.fontSize = t >= B(3) - 0.05 && t < B(4) ? '64px' : '36px'

      cursor.style.left = `${sw / 2 + T.mx.at(t) * z}px`
      cursor.style.top = `${sh / 2 + T.my.at(t) * z}px`
      cursor.style.opacity = t >= B(6) - 0.05 && t < B(7) - 0.05 ? '0.15' : '1'

      hud.style.opacity = String(T.hud.at(t))
    }

    window.seek(0)
  </script>
</body>
</html>
