<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: Inter, 'Apple Color Emoji', sans-serif;
    color: #0c0a09;
    background: #fbfaf7;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .bg { position: absolute; inset: -20%; pointer-events: none; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .abs { position: absolute; will-change: transform, opacity; }
  .headline { font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; text-wrap: balance; }
  .sub { font-weight: 500; color: #57534e; line-height: 1.3; text-wrap: balance; }
  .word { display: inline-block; white-space: pre; }
  .phone {
    background: #0c0a09;
    box-shadow: 0 40px 80px rgba(41, 37, 36, 0.28), 0 10px 24px rgba(41, 37, 36, 0.16), inset 0 0 0 2px #44403c;
  }
  .phone .screen { position: absolute; overflow: hidden; background: #fff; }
  .phone .screen img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .crop {
    border-radius: 28px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 30px 70px rgba(41, 37, 36, 0.3), 0 8px 20px rgba(41, 37, 36, 0.14);
    outline: 1px solid rgba(12, 10, 9, 0.08);
  }
  .crop img { display: block; width: 100%; height: 100%; }
  .browser {
    border-radius: 18px; overflow: hidden; background: #fff;
    box-shadow: 0 40px 90px rgba(41, 37, 36, 0.26), 0 10px 24px rgba(41, 37, 36, 0.12);
    outline: 1px solid rgba(12, 10, 9, 0.1);
  }
  .browser .bar { height: 44px; background: #f5f5f4; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid #e7e5e4; }
  .browser .dot { width: 12px; height: 12px; border-radius: 50%; }
  .browser .url { margin-left: 18px; flex: 1; max-width: 420px; height: 28px; border-radius: 8px; background: #fff; font-size: 14px; color: #57534e; display: flex; align-items: center; padding: 0 12px; font-weight: 500; }
  .browser img { display: block; width: 100%; }
  .pill { background: #facc15; color: #422006; font-weight: 700; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 12px 30px rgba(250, 204, 21, 0.45); }
  .logo { border-radius: 22%; box-shadow: 0 20px 50px rgba(41, 37, 36, 0.25); }
  .tag { color: #ca8a04; font-weight: 700; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
  const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3)
  const easeInOut = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2 }
  const back = (x) => { x = clamp(x); const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2) }
  // 0 → 1 over [start, start + length].
  const ramp = (t, start, length) => clamp((t - start) / length)

  const el = (parent, className, style = {}, html) => {
    const node = document.createElement('div')
    node.className = className
    Object.assign(node.style, style)
    if (html !== undefined) node.innerHTML = html
    parent.appendChild(node)
    return node
  }
  const img = (parent, src, style = {}) => {
    const node = document.createElement('img')
    node.src = src
    Object.assign(node.style, style)
    parent.appendChild(node)
    return node
  }
  const px = (v) => `${v}px`
  const set = (node, { x = 0, y = 0, s = 1, r = 0, o = 1 }) => {
    node.style.transform = `translate(${x}px, ${y}px) scale(${s}) rotate(${r}deg)`
    node.style.opacity = o
  }
  const words = (parent, text) =>
    text.split(/(\s+)/).filter(Boolean).map((part) => {
      const span = document.createElement('span')
      span.className = 'word'
      span.textContent = part
      parent.appendChild(span)
      return span
    })

  let W, H, orient, config, scenes = [], fitters = []

  // A layout box per orientation.
  const L = () => {
    if (orient === 'portrait') return {
      cap: { x: 80, y: 170, w: W - 160, size: 74, sub: 40, align: 'center' },
      phone: { w: 590, x: (W - 590) / 2, y: 520 },
      crop: { w: 760, x: (W - 760) / 2 + 60, y: 1150 },
    }
    if (orient === 'square') return {
      cap: { x: 70, y: 90, w: W - 140, size: 58, sub: 32, align: 'center' },
      phone: { w: 410, x: (W - 410) / 2 - 150, y: 400 },
      crop: { w: 560, x: W - 560 - 60, y: 690 },
    }
    return {
      cap: { x: 130, y: 0, w: 720, size: 72, sub: 34, align: 'left', middle: true },
      phone: { w: 420, x: 1300, y: 100 },
      crop: { w: 620, x: 930, y: 560 },
    }
  }

  const screenRatio = 2532 / 1170
  const makePhone = (parent, srcs, w) => {
    const bezel = Math.round(w * 0.032)
    const sw = w - bezel * 2
    const sh = Math.round(sw * screenRatio)
    const h = sh + bezel * 2
    const node = el(parent, 'abs phone', { width: px(w), height: px(h), borderRadius: px(w * 0.15), transformOrigin: '50% 50%' })
    const screen = el(node, 'screen', { left: px(bezel), top: px(bezel), width: px(sw), height: px(sh), borderRadius: px(w * 0.12) })
    const imgs = srcs.map((src, i) => img(screen, src, { opacity: i === 0 ? 1 : 0 }))
    return { node, imgs, h }
  }

  const caption = (parent, text, box, t0 = 0.15) => {
    const wrap = el(parent, 'abs', { left: px(box.x), top: px(box.y), width: px(box.w), textAlign: box.align })
    const h = el(wrap, 'headline', { fontSize: px(box.size) })
    const ws = words(h, text.title)
    let sub
    if (text.sub) sub = el(wrap, 'sub', { fontSize: px(box.sub), marginTop: px(box.sub * 0.6) }, text.sub)
    if (box.middle) requestAnimationFrame(() => {})
    return {
      wrap,
      update(t) {
        ws.forEach((w, i) => {
          const p = easeOut(ramp(t, t0 + i * 0.045, 0.45))
          set(w, { y: (1 - p) * 40, o: p })
        })
        if (sub) { const p = easeOut(ramp(t, t0 + 0.35 + ws.length * 0.03, 0.5)); set(sub, { y: (1 - p) * 24, o: p }) }
      },
    }
  }

  // An illustrated person, head and shoulders in a circle (the stories
  // videos). update(t, level) blinks, sways, and opens the mouth by how loud
  // their voice is (0 to 1) in that frame.
  const SVG = 'http://www.w3.org/2000/svg'
  const shade = (hex, amount) => {
    const n = parseInt(hex.slice(1), 16)
    const f = (c) => Math.max(0, Math.min(255, Math.round(c * (1 + amount))))
    return `rgb(${f(n >> 16)}, ${f((n >> 8) & 255)}, ${f(n & 255)})`
  }
  let people = 0
  // The head, in a 400 × 400 box with the neck at (200, 300): the faces in
  // circles share it.
  const headParts = (look) => {
    const hairColor = look.hairColor ?? '#2b1d16'
    const hijab = look.hair === 'hijab'
    const front = {
      short: `<path d="M126 196 C 116 122 160 96 205 98 C 256 100 288 130 278 196 C 272 160 252 140 215 138 C 178 136 150 142 134 172 Z" fill="${hairColor}"/>`,
      messy: [[140, 160, 30], [160, 128, 32], [196, 112, 36], [236, 120, 33], [264, 150, 30], [124, 186, 18], [278, 182, 18]]
        .map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${hairColor}"/>`).join(''),
      bun: `<path d="M122 210 C 110 122 158 96 200 98 C 246 96 292 122 278 210 C 274 168 250 136 204 134 C 160 136 128 160 122 210 Z" fill="${hairColor}"/>`,
      // Parted to one side.
      long: `<path d="M120 214 C 108 124 156 94 206 96 C 250 98 292 124 280 214 C 270 166 246 132 188 136 C 150 142 128 170 120 214 Z" fill="${hairColor}"/>`,
    }
    return {
      hijab,
      behind: (look.hair === 'long' ? `<path d="M104 210 C 96 116 150 86 200 86 C 250 86 304 116 296 210 L 306 348 C 262 362 138 362 94 348 Z" fill="${hairColor}"/>` : '') +
        (look.hair === 'bun' ? `<circle cx="200" cy="84" r="38" fill="${hairColor}"/><ellipse cx="200" cy="200" rx="96" ry="104" fill="${hairColor}"/>` : ''),
      neck: hijab ? '' : `<rect x="170" y="250" width="60" height="90" rx="24" fill="${shade(look.skin, -0.12)}"/>`,
      drape: hijab ? `<path d="M200 62 C 108 62 92 150 98 226 C 102 292 124 352 200 376 C 276 352 298 292 302 226 C 308 150 292 62 200 62 Z" fill="${look.cloth}"/><ellipse class="opening" cx="200" cy="200" rx="80" ry="94" fill="${shade(look.cloth, -0.12)}"/>` : '',
      head: `<g class="head">
            <g class="ear-l">${hijab ? '' : `<ellipse cx="124" cy="204" rx="15" ry="21" fill="${shade(look.skin, -0.06)}"/>`}</g>
            <g class="ear-r">${hijab ? '' : `<ellipse cx="276" cy="204" rx="15" ry="21" fill="${shade(look.skin, -0.06)}"/>`}</g>
            <ellipse cx="200" cy="200" rx="${hijab ? 72 : 77}" ry="${hijab ? 85 : 90}" fill="${look.skin}"/>
            <g class="ear-l">${look.earrings ? '<circle cx="124" cy="230" r="6" fill="#e9b949"/>' : ''}</g>
            <g class="ear-r">${look.earrings ? '<circle cx="276" cy="230" r="6" fill="#e9b949"/>' : ''}</g>
            ${look.stubble ? `<path d="M134 222 C 142 300 258 300 266 222 C 256 274 144 274 134 222 Z" fill="${hairColor}" opacity="0.2"/>` : ''}
            ${front[look.hair] ?? ''}
            <g class="features">
            <circle cx="153" cy="234" r="15" fill="#f0827a" opacity="0.22"/>
            <circle cx="247" cy="234" r="15" fill="#f0827a" opacity="0.22"/>
            <path d="M154 176 Q170 167 186 175" fill="none" stroke="${hijab ? '#3a2a22' : hairColor}" stroke-width="6" stroke-linecap="round"/>
            <path d="M214 175 Q230 167 246 176" fill="none" stroke="${hijab ? '#3a2a22' : hairColor}" stroke-width="6" stroke-linecap="round"/>
            <g class="eyes">
              <ellipse cx="170" cy="202" rx="8.5" ry="10.5" fill="#2a1d17"/><circle cx="173" cy="198" r="3" fill="#fff"/>
              <ellipse cx="230" cy="202" rx="8.5" ry="10.5" fill="#2a1d17"/><circle cx="233" cy="198" r="3" fill="#fff"/>
            </g>
            ${look.glasses ? '<g fill="rgba(255,255,255,0.12)" stroke="#2b2b30" stroke-width="5"><circle cx="170" cy="203" r="25"/><circle cx="230" cy="203" r="25"/><path d="M195 201 Q200 196 205 201" fill="none"/></g>' : ''}
            <path d="M200 208 Q193 230 205 232" fill="none" stroke="${shade(look.skin, -0.22)}" stroke-width="4.5" stroke-linecap="round"/>
            <path class="smile" d="M180 252 Q200 268 220 252" fill="none" stroke="#7a3b2e" stroke-width="5.5" stroke-linecap="round"/>
            <g class="open"><ellipse cx="200" cy="256" rx="17" ry="10" fill="#6b2a22"/><ellipse cx="200" cy="263" rx="10" ry="4" fill="#d9776b"/></g>
            </g>
          </g>`,
    }
  }
  // Blinks, nods and opens the mouth by how loud the voice is (0 to 1).
  const animateHead = (root, seed) => {
    const head = root.querySelector('.head')
    const eyes = root.querySelector('.eyes')
    const smile = root.querySelector('.smile')
    const open = root.querySelector('.open')
    const mouth = open.querySelector('ellipse')
    const features = root.querySelector('.features'), opening = root.querySelector('.opening')
    const ears = [...root.querySelectorAll('.ear-l')].map((node) => [node, -1]).concat([...root.querySelectorAll('.ear-r')].map((node) => [node, 1]))
    let turned = null
    return (t, level, tilt = 0, turn = 0) => {
      // Turning (−1 left, 1 right): the face moves toward where they look,
      // the near ear toward the face, the far one goes out of sight.
      if (turn !== turned) {
        turned = turn
        features.setAttribute('transform', `translate(${turn * 34} 0)`)
        opening?.setAttribute('transform', `translate(${turn * 12} 0)`)
        ears.forEach(([node, side]) => {
          const far = side * turn > 0
          node.style.opacity = far ? clamp(1 - Math.abs(turn) * 2.5) : 1
          node.setAttribute('transform', `translate(${far ? 0 : turn * 18} 0)`)
        })
      }
      // A blink every few seconds, 0.14 s long.
      const cycle = (t + seed) % 3.4
      const blink = cycle < 0.14 ? Math.abs(Math.cos((cycle / 0.14) * Math.PI)) : 1
      eyes.setAttribute('transform', `translate(0 202) scale(1 ${Math.max(0.08, blink)}) translate(0 -202)`)
      const nod = Math.sin(t * 1.3 + seed) * 1.6 + level * 2.2 + tilt
      head.setAttribute('transform', `rotate(${nod} 200 300) translate(0 ${-level * 3})`)
      const talking = level > 0.06
      smile.style.opacity = talking ? 0 : 1
      open.style.opacity = talking ? 1 : 0
      mouth.setAttribute('ry', (3 + level * 13).toFixed(1))
      mouth.setAttribute('rx', (13 + level * 5).toFixed(1))
    }
  }
  const character = (parent, look, size) => {
    const id = `p${people++}`
    const svg = document.createElementNS(SVG, 'svg')
    svg.setAttribute('viewBox', '0 0 400 400')
    svg.setAttribute('width', size)
    svg.setAttribute('height', size)
    svg.style.overflow = 'visible'
    svg.style.flex = 'none'
    const { hijab, behind, neck, drape, head } = headParts(look)
    svg.innerHTML = `
      <defs><clipPath id="${id}"><circle cx="200" cy="200" r="200"/></clipPath></defs>
      <g clip-path="url(#${id})">
        <circle cx="200" cy="200" r="200" fill="${look.bg}"/>
        <g class="sway">
          ${behind}
          ${neck}
          <path d="M30 420 C 40 338 110 316 200 316 C 290 316 360 338 370 420 Z" fill="${look.top}"/>
          ${hijab ? '' : `<path d="M168 318 Q200 350 232 318" fill="none" stroke="${shade(look.top, -0.25)}" stroke-width="6" stroke-linecap="round"/>`}
          ${look.headphones ? '<path d="M118 340 C 118 290 282 290 282 340" fill="none" stroke="#2f2f35" stroke-width="14" stroke-linecap="round"/><ellipse cx="120" cy="344" rx="20" ry="26" fill="#2f2f35"/><ellipse cx="280" cy="344" rx="20" ry="26" fill="#2f2f35"/>' : ''}
          ${drape}
          ${head}
        </g>
      </g>`
    parent.appendChild(svg)
    const sway = svg.querySelector('.sway')
    const seed = people * 1.7
    const face = animateHead(svg, seed)
    return {
      svg,
      update(t, level = 0) {
        face(t, level)
        sway.setAttribute('transform', `translate(0 ${Math.sin(t * 0.9 + seed) * 2.5})`)
      },
    }
  }

  // A shopping bag, full, standing on its bottom at y 174.
  const shoppingBag = (color) => `
    <path d="M-60 36 L-6 4 M60 36 L6 4" stroke="${shade(color, -0.35)}" stroke-width="7" stroke-linecap="round" fill="none"/>
    <rect x="-44" y="-30" width="20" height="78" rx="6" fill="#7cb85a" transform="rotate(-12 -34 40)"/>
    <rect x="18" y="-6" width="26" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="18" y="-14" width="26" height="12" rx="3" fill="#3b82f6"/>
    <circle cx="-4" cy="26" r="20" fill="#ef6f4c"/>
    <path d="M-64 34 L64 34 L57 170 Q0 178 -57 170 Z" fill="${color}"/>
    <path d="M-64 34 L64 34 L63 50 L-63 50 Z" fill="${shade(color, -0.12)}"/>`
  // Groceries, standing on the bottom of their box.
  const grocery = {
    milk: '<path d="M-22 0 L-22 -70 L-12 -88 L12 -88 L22 -70 L22 0 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><rect x="-22" y="-52" width="44" height="22" fill="#60a5fa"/>',
    rice: '<path d="M-32 0 Q-36 -50 -26 -84 L26 -84 Q36 -50 32 0 Z" fill="#fef3c7" stroke="#e5c97a" stroke-width="3"/><rect x="-22" y="-56" width="44" height="22" rx="4" fill="#dc2626"/>',
    oil: '<rect x="-16" y="-80" width="32" height="80" rx="9" fill="#facc15" opacity="0.9"/><rect x="-7" y="-96" width="14" height="18" rx="3" fill="#16a34a"/>',
    eggs: '<rect x="-40" y="-34" width="80" height="34" rx="6" fill="#d6b98c"/><circle cx="-22" cy="-36" r="11" fill="#fff7ed"/><circle cx="0" cy="-38" r="11" fill="#fff7ed"/><circle cx="22" cy="-36" r="11" fill="#fff7ed"/>',
    noodles: '<rect x="-30" y="-46" width="60" height="46" rx="5" fill="#fde047"/><rect x="-30" y="-30" width="60" height="12" fill="#dc2626"/>',
    veg: '<ellipse cx="0" cy="-16" rx="30" ry="16" fill="#65a30d"/><path d="M-6 -30 Q0 -58 10 -64" stroke="#3f6212" stroke-width="6" fill="none" stroke-linecap="round"/>',
  }

  // A cardboard box from a supplier, standing on its bottom.
  const box = '<rect x="-75" y="-110" width="150" height="110" rx="6" fill="#c99a66"/><rect x="-75" y="-110" width="150" height="18" rx="6" fill="#b07a4f" opacity="0.45"/><rect x="-13" y="-110" width="26" height="110" fill="#e7c9a0" opacity="0.85"/>'
  // A receipt pushed onto a spike, resting on its bottom edge.
  const slip = '<rect x="-32" y="-46" width="64" height="46" fill="url(#receipt-lines)" stroke="#d6d3d1" stroke-width="2"/>'

  // What every place has: receipt paper, the layer `fx` draws in, and a
  // camera flash over it.
  const receiptPaper = `
    <pattern id="receipt-lines" width="52" height="18" patternUnits="userSpaceOnUse">
      <rect width="52" height="18" fill="#fff"/><line x1="8" y1="11" x2="30" y2="11" stroke="#a8a29e" stroke-width="3"/><line x1="36" y1="11" x2="46" y2="11" stroke="#a8a29e" stroke-width="3"/>
    </pattern>`
  const stageTop = `
    <g class="fx"></g>
    <circle class="flash" cx="0" cy="0" r="160" fill="url(#flash)" opacity="0"/>
    <defs><radialGradient id="flash"><stop offset="0" stop-color="#fff"/><stop offset="0.4" stop-color="#fff" stop-opacity="0.8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>`

  // Places a story happens in, in a 1600 × 1240 world. `full` and `strip`
  // are the views of it: the opening scene, and the band over the app's
  // screens after it.
  const places = {
    kitchen: {
      full: '640 300 700 796',
      strip: '640 345 760 405',
      draw: () => {
        const tiles = Array.from({ length: 9 }, (_, i) => `<line x1="${700 + i * 75}" y1="470" x2="${700 + i * 75}" y2="690"/>`).join('') +
          [545, 620].map((y) => `<line x1="700" y1="${y}" x2="1300" y2="${y}"/>`).join('')
        const planks = Array.from({ length: 12 }, (_, i) => `<line x1="${i * 140}" y1="1060" x2="${i * 140 - 60}" y2="1240"/>`).join('')
        return `
          <defs>
            ${receiptPaper}
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3f7"/><stop offset="1" stop-color="#e8f6fd"/></linearGradient>
          </defs>
          <rect width="1600" height="1240" fill="#fbeedb"/>
          <rect y="1060" width="1600" height="180" fill="#e7c9a0"/>
          <g stroke="#d4b185" stroke-width="3">${planks}</g>
          <rect y="1052" width="1600" height="12" fill="#e2b98a"/>
          <!-- window, with curtains and a plant on the sill -->
          <rect x="330" y="250" width="320" height="380" rx="14" fill="#fff"/>
          <rect x="350" y="270" width="280" height="340" rx="6" fill="url(#sky)"/>
          <circle cx="560" cy="350" r="34" fill="#fde68a"/>
          <path d="M380 420 q30 -30 60 0 q24 -20 46 4 Z" fill="#fff" opacity="0.9"/>
          <path d="M490 300 L490 610 M350 440 L630 440" stroke="#fff" stroke-width="10"/>
          <path d="M310 236 Q360 420 330 650 L300 650 L300 236 Z M670 236 Q620 420 650 650 L680 650 L680 236 Z" fill="#f4b860"/>
          <rect x="296" y="226" width="388" height="16" rx="8" fill="#b45309"/>
          <rect x="320" y="628" width="340" height="16" rx="6" fill="#fff"/>
          <path d="M420 628 L428 588 L456 588 L464 628 Z" fill="#c2703d"/>
          <path d="M442 590 C 420 560 410 540 420 520 C 440 540 444 560 442 590 C 450 556 466 538 480 534 C 476 560 460 580 442 590" fill="#5fa36f"/>
          <!-- upper cabinets, a shelf, tiles -->
          <rect x="700" y="230" width="600" height="200" rx="10" fill="#8fb8a8"/>
          <path d="M1000 240 L1000 420" stroke="#7aa594" stroke-width="6"/>
          <rect x="970" y="300" width="10" height="56" rx="5" fill="#f5f5f4"/><rect x="1020" y="300" width="10" height="56" rx="5" fill="#f5f5f4"/>
          <rect x="700" y="430" width="600" height="260" fill="#f4f6f3"/>
          <g stroke="#dfe7e1" stroke-width="3">${tiles}</g>
          <rect x="720" y="462" width="390" height="14" rx="5" fill="#b07a4f"/>
          <!-- counter -->
          <rect x="690" y="690" width="620" height="28" rx="6" fill="#e9dcc8"/>
          <rect x="700" y="718" width="600" height="342" fill="#8fb8a8"/>
          <path d="M900 730 L900 1050 M1100 730 L1100 1050" stroke="#7aa594" stroke-width="6"/>
          <rect x="860" y="770" width="10" height="60" rx="5" fill="#f5f5f4"/><rect x="930" y="770" width="10" height="60" rx="5" fill="#f5f5f4"/><rect x="1130" y="770" width="10" height="60" rx="5" fill="#f5f5f4"/>
          <rect x="700" y="1040" width="600" height="20" fill="#6e9686"/>
          <!-- rice cooker -->
          <rect x="1196" y="606" width="104" height="84" rx="30" fill="#fafaf9" stroke="#d6d3d1" stroke-width="4"/>
          <rect x="1234" y="636" width="28" height="16" rx="4" fill="#f87171"/>
          <!-- fridge -->
          <rect x="1316" y="330" width="230" height="730" rx="22" fill="#eef1f2" stroke="#d5dadc" stroke-width="5"/>
          <path d="M1316 560 L1546 560" stroke="#d5dadc" stroke-width="5"/>
          <rect x="1340" y="430" width="12" height="90" rx="6" fill="#b8c0c4"/><rect x="1340" y="600" width="12" height="120" rx="6" fill="#b8c0c4"/>
          <rect x="1420" y="380" width="70" height="50" rx="6" fill="#fde68a" transform="rotate(4 1455 405)"/>
          ${stageTop}`
      },
    },
    // Pak Hendra's toko kelontong, drawn by Recraft (places-art.mjs, passed
    // in as `art`): 2048 × 1536, filling the world's height.
    shop: {
      full: '740 150 700 796',
      strip: '700 380 760 405',
      draw: () => `
        <defs>${receiptPaper}</defs>
        ${config.art.shop.replace(/<svg[^>]*>/, '<svg viewBox="0 0 2048 1536" x="-27" width="1654" height="1240">')}
        ${stageTop}`,
    },
  }

  // What happens in a place, drawn in it and moved each frame. A place's
  // own things (`fx`) act out the story; the person is their face, in a
  // corner of the place, talking.
  const KITCHEN = {
    // The bag stands on the counter (y 690), its opening at y 480.
    bag: [960, 690, 1.5],
    // Where the shopping lands on the counter, then on the shelf.
    items: [['milk', 715, 690], ['rice', 790, 690], ['eggs', 870, 690], ['veg', 870, 652], ['oil', 1058, 690], ['noodles', 1124, 690]],
    shelf: [745, 815, 885, 955, 1025, 1095].map((x) => [x, 462]),
  }
  const SHOP = {
    // The supplier boxes, stacked on the counter (y 680) where Recraft had
    // drawn a crate (its dip in the counter is under them).
    boxes: [[1170, 686], [1330, 686], [1250, 576]],
    // A receipt spike on the counter, and where each receipt rests on it.
    spike: [880, 680],
    slips: Array.from({ length: 10 }, (_, i) => [880 + Math.sin(i * 2.7) * 7, 664 - i * 9, Math.sin(i * 1.9) * 9]),
  }
  // The spike, drawn under its receipts: its tip shows above the pile.
  const spike = (layer) => {
    const [x, y] = SHOP.spike
    svgEl(layer, `<g transform="translate(${x} ${y})"><rect x="-3" y="-250" width="6" height="240" rx="3" fill="#78716c"/><rect x="-40" y="-16" width="80" height="16" rx="6" fill="#5e8f86"/></g>`)
  }
  // A hop along an arc from one spot to another; lands with a squash.
  const hop = (node, t, start, [x0, y0], [x1, y1], { length = 0.45, height = 170, spin = 0 } = {}) => {
    const p = clamp((t - start) / length)
    node.style.opacity = t < start ? 0 : 1
    const x = x0 + (x1 - x0) * p
    const y = y0 + (y1 - y0) * p - Math.sin(p * Math.PI) * height
    const land = ramp(t, start + length, 0.18)
    const squash = land > 0 && land < 1 ? 1 - Math.sin(land * Math.PI) * 0.16 : 1
    node.setAttribute('transform', `translate(${x} ${y}) rotate(${(1 - p) * spin}) scale(${2 - squash} ${squash})`)
  }
  const svgEl = (parent, html) => {
    const g = document.createElementNS(SVG, 'g')
    g.innerHTML = html
    parent.appendChild(g)
    return g
  }
  const fx = {
    // The bag drops onto the counter and the shopping tumbles out, item
    // after item; then the receipt comes out, and keeps unrolling.
    arrive: (layer) => {
      const [bx, by, bs] = KITCHEN.bag
      const bag = svgEl(layer, shoppingBag('#e6cfa6'))
      const items = KITCHEN.items.map(([name]) => svgEl(layer, grocery[name]))
      const receipt = svgEl(layer, '<rect class="strip" x="-32" y="0" width="64" height="20" fill="url(#receipt-lines)" stroke="#d6d3d1" stroke-width="2"/><ellipse class="curl" cx="0" cy="20" rx="34" ry="9" fill="#f5f5f4" stroke="#d6d3d1" stroke-width="2"/>')
      const strip = receipt.querySelector('.strip'), curl = receipt.querySelector('.curl')
      return (t) => {
        const drop = back(ramp(t, 0, 0.45))
        bag.setAttribute('transform', `translate(${bx} ${by - 174 * bs - (1 - drop) * 520}) scale(${bs})`)
        items.forEach((node, i) => {
          const [, x, y] = KITCHEN.items[i]
          hop(node, t, 0.55 + i * 0.27, [bx, by - 200], [x, y], { spin: i % 2 ? 40 : -40 })
        })
        // Pops out of the bag, then unrolls down the front of the counter
        // and off the bottom.
        const pop = back(ramp(t, 2.35, 0.3)), unroll = easeOut(ramp(t, 2.6, 1.9))
        const length = 20 + pop * 30 + unroll * 720
        receipt.style.opacity = t < 2.35 ? 0 : 1
        receipt.setAttribute('transform', `translate(${bx} ${by - 216 - pop * 40}) rotate(${Math.sin(t * 2.4) * 1.5 * unroll})`)
        strip.setAttribute('height', length)
        curl.setAttribute('cy', length)
      }
    },
    // A phone photographs the receipt (camera).
    snap: (layer, svg) => {
      const [bx, by, bs] = KITCHEN.bag
      svgEl(layer, `<g transform="translate(${bx} ${by - 174 * bs}) scale(${bs})">${shoppingBag('#e6cfa6')}</g>`)
      KITCHEN.items.forEach(([name, x, y]) => svgEl(layer, `<g transform="translate(${x} ${y})">${grocery[name]}</g>`))
      svgEl(layer, `<g transform="translate(${bx} ${by - 256})"><rect x="-32" y="0" width="64" height="770" fill="url(#receipt-lines)" stroke="#d6d3d1" stroke-width="2"/></g>`)
      return camera(layer, svg, { at: [985, 600], flash: [bx, 560], lines: [bx, by - 150] })
    },
    // The shopping hops off the counter onto the shelf, one after another.
    unpack: (layer) => {
      const [bx, by, bs] = KITCHEN.bag
      svgEl(layer, `<g transform="translate(${bx} ${by - 174 * bs}) scale(${bs})">${shoppingBag('#e6cfa6')}</g>`)
      svgEl(layer, `<g transform="translate(${bx} ${by - 256})"><rect x="-32" y="0" width="64" height="770" fill="url(#receipt-lines)" stroke="#d6d3d1" stroke-width="2"/></g>`)
      const items = KITCHEN.items.map(([name]) => svgEl(layer, grocery[name]))
      return (t) => {
        items.forEach((node, i) => {
          const [, x, y] = KITCHEN.items[i]
          const start = 0.35 + i * 0.32
          hop(node, t, start, [x, y], KITCHEN.shelf[i], { height: 120, length: 0.5 })
          if (t < start) { node.style.opacity = 1; node.setAttribute('transform', `translate(${x} ${y})`) }
        })
      }
    },
    // The supplier boxes drop onto the counter one after another, each with
    // its receipt, which goes onto the spike; then the rest of the week's
    // receipts flutter down onto the pile.
    restock: (layer) => {
      const boxes = SHOP.boxes.map(() => svgEl(layer, box))
      spike(layer)
      const slips = SHOP.slips.map(([, , r]) => svgEl(layer, `<g transform="rotate(${r})">${slip}</g>`))
      return (t) => {
        boxes.forEach((node, i) => {
          const [x, y] = SHOP.boxes[i]
          hop(node, t, 0.1 + i * 0.45, [x, y - 700], [x, y], { height: 0, length: 0.4 })
        })
        slips.forEach((node, i) => {
          const [x, y] = SHOP.slips[i]
          if (i < SHOP.boxes.length) {
            // Out of its box as it lands, over onto the spike.
            const [bx, by] = SHOP.boxes[i]
            hop(node, t, 0.55 + i * 0.45, [bx, by - 110], [x, y], { height: 160, spin: i % 2 ? 50 : -50 })
          } else {
            hop(node, t, 1.9 + (i - SHOP.boxes.length) * 0.3, [x + (i % 2 ? 60 : -60), 300], [x, y], { height: 0, length: 0.5, spin: i % 2 ? -30 : 30 })
          }
        })
      }
    },
    // A phone photographs the pile of receipts (camera).
    scan: (layer, svg) => {
      SHOP.boxes.forEach(([x, y]) => svgEl(layer, `<g transform="translate(${x} ${y})">${box}</g>`))
      spike(layer)
      SHOP.slips.forEach(([x, y, r]) => svgEl(layer, `<g transform="translate(${x} ${y}) rotate(${r})">${slip}</g>`))
      const [sx, sy] = SHOP.spike
      return camera(layer, svg, { at: [1030, 520], flash: [sx, sy - 70], lines: [sx, sy - 90], gap: 10 })
    },
    // Read, the receipts come off the spike one by one, top first, and fly
    // up out of the place: filed.
    file: (layer) => {
      SHOP.boxes.forEach(([x, y]) => svgEl(layer, `<g transform="translate(${x} ${y})">${box}</g>`))
      spike(layer)
      const slips = SHOP.slips.map(([, , r]) => svgEl(layer, `<g transform="rotate(${r})">${slip}</g>`))
      return (t) => {
        slips.forEach((node, i) => {
          const [x, y] = SHOP.slips[i]
          const q = easeInOut(ramp(t, 0.35 + (slips.length - 1 - i) * 0.2, 0.7))
          node.style.opacity = 1 - ramp(q, 0.6, 0.4)
          node.setAttribute('transform', `translate(${x + Math.sin(i * 2.1) * 90 * q} ${y - q * 520}) rotate(${q * (i % 2 ? 30 : -30)}) scale(${1 - q * 0.4})`)
        })
      }
    },
  }

  // A phone comes up in front of a receipt, screen to us and camera to the
  // receipt, which fills its viewfinder; it takes the photo and the
  // receipt's lines fly up out of it, read. `at` is where the phone is held,
  // `flash` where it lights up, `lines` where the read lines start, `gap`
  // apart.
  const camera = (layer, svg, { at: [px0, py0], flash: [fx0, fy0], lines: [lx, ly], gap = 34 }) => {
    const lines = Array.from({ length: 8 }, () => svgEl(layer, '<rect x="-26" y="-4" width="52" height="8" rx="4" fill="#facc15"/>'))
    const phone = svgEl(layer, `
      <rect x="-80" y="-150" width="160" height="300" rx="28" fill="#1f1d1b"/>
      <rect x="-70" y="-138" width="140" height="276" rx="20" fill="#3f3b38"/>
      <rect x="-30" y="-120" width="60" height="230" fill="url(#receipt-lines)"/>
      <path d="M-56 -100 v-22 h22 M56 -100 v-22 h-22 M-56 90 v22 h22 M56 90 v22 h-22" stroke="#facc15" stroke-width="6" fill="none" stroke-linecap="round"/>
      <circle cy="124" r="11" fill="none" stroke="#fff" stroke-width="4"/>
      <rect class="shutter" x="-70" y="-138" width="140" height="276" rx="20" fill="#fff" opacity="0"/>`)
    const shutter = phone.querySelector('.shutter')
    const flash = svg.querySelector('.flash')
    return (t) => {
      const p = back(ramp(t, 0.25, 0.6))
      // Held a little in front of the receipt, which shows around it.
      phone.setAttribute('transform', `translate(${1440 - (1440 - px0) * p} ${py0 + Math.sin(t * 1.6) * 5}) rotate(${(1 - p) * 14 - 4}) scale(0.78)`)
      // The flash lights up the receipt; the screen blinks like a shutter.
      const f = ramp(t, 1.1, 0.08) * (1 - ramp(t, 1.2, 0.45))
      flash.setAttribute('opacity', f * 0.9)
      flash.setAttribute('cx', fx0)
      flash.setAttribute('cy', fy0)
      shutter.setAttribute('opacity', f)
      lines.forEach((node, i) => {
        const start = 1.3 + i * 0.1, q = easeInOut(ramp(t, start, 0.7))
        node.style.opacity = t < start ? 0 : 1 - ramp(t, start + 0.5, 0.2)
        node.setAttribute('transform', `translate(${lx + Math.sin(i * 2.1) * 40 * q} ${ly + i * gap - q * 480}) scale(${1 - q * 0.4})`)
      })
    }
  }

  // A place with its story acted out, and the speaker's face in its top
  // corner; returns the svg and update(t, level).
  let views = 0
  const placeView = (parent, s, view, faceSize) => {
    const place = places[s.place]
    const svg = document.createElementNS(SVG, 'svg')
    svg.setAttribute('viewBox', place[view])
    svg.setAttribute('preserveAspectRatio', 'xMidYMid slice')
    svg.innerHTML = place.draw()
    parent.appendChild(svg)
    const act = fx[s.act](svg.querySelector('.fx'), svg)
    // Every scene draws the place again: its patterns and gradients get ids
    // of their own, or the fills would point at a hidden scene's and vanish.
    const n = views++
    svg.querySelectorAll('[id]').forEach((node) => { node.id = `${node.id}-${n}` })
    svg.querySelectorAll('[fill^="url(#"]').forEach((node) => node.setAttribute('fill', node.getAttribute('fill').replace(')', `-${n})`)))
    const corner = el(parent, 'abs', { left: px(faceSize * 0.22), top: px(faceSize * 0.22) })
    const face = character(corner, s.cast[s.lines[0].who].look, faceSize)
    face.svg.style.filter = 'drop-shadow(0 12px 24px rgba(41, 37, 36, 0.22))'
    return {
      svg,
      update(t, level) {
        act(t)
        const p = back(ramp(t, 0.15, 0.5))
        set(face.svg, { s: 0.5 + 0.5 * p, o: clamp(p * 2) })
        face.update(t, level)
      },
    }
  }
  // Under a place: what the app does (tag) and what they say, word by word.
  const placeCaption = (parent, s, box) => {
    const wrap = el(parent, 'abs', { left: px(box.x), top: px(box.y), width: px(box.w), textAlign: 'center' })
    const tag = el(wrap, 'pill', { fontSize: px(box.sub * 0.85), padding: `${box.sub * 0.3}px ${box.sub * 0.65}px`, boxShadow: 'none' }, s.tag)
    const quotes = s.lines.map((line) => quote(wrap, line, { fontSize: px(box.size), marginTop: px(box.size * 0.35), fontWeight: 700 }))
    return {
      wrap,
      update(t) {
        const a = t - s.lead
        const q = easeOut(ramp(t, 0.25, 0.45))
        set(tag, { y: (1 - q) * 20, o: q })
        const current = lineAt(s.lines, a)
        quotes.forEach((item, i) => {
          item.node.style.display = s.lines[i] === current ? 'block' : 'none'
          item.update(a)
        })
      },
    }
  }
  // A place fills the top of the frame and fades into the page below it.
  const placeBand = (root, s, view, height) => {
    const band = el(root, 'abs', { left: 0, top: 0, width: px(W), height: px(height), overflow: 'hidden' })
    const scene = placeView(band, s, view, Math.round(height * (view === 'full' ? 0.2 : 0.3)))
    scene.svg.setAttribute('width', W)
    scene.svg.setAttribute('height', height)
    el(band, 'abs', { left: 0, right: 0, bottom: 0, height: px(height * 0.16), background: 'linear-gradient(rgba(251, 250, 247, 0), #fbfaf7)' })
    return scene
  }

  // A scene's lines ({ who, text, at, d, levels }), timed from the scene's
  // start. levels: loudness per frame (none when rendered silent: a made-up
  // talking rhythm instead).
  const lineAt = (lines, a) => lines.reduce((current, line) => (a >= line.at - 0.15 ? line : current), lines[0])
  const levelOf = (lines, who, a) => {
    const line = lines.find((l) => l.who === who && a >= l.at && a < l.at + l.d)
    if (!line) return 0
    if (line.levels) return line.levels[Math.floor((a - line.at) * 30)] ?? 0
    return Math.max(0, Math.sin((a - line.at) * 17) * 0.5 + Math.sin((a - line.at) * 7.3) * 0.4)
  }
  // Words appear as they're said.
  const quote = (parent, line, style) => {
    const node = el(parent, 'headline', style)
    const ws = words(node, line.text)
    return {
      node,
      update(a) {
        ws.forEach((w, i) => {
          const p = easeOut(ramp(a, line.at - 0.1 + (i / ws.length) * line.d * 0.85, 0.25))
          set(w, { y: (1 - p) * 18, o: 0.12 + 0.88 * p })
        })
      },
    }
  }

  // The caption of an app scene in the stories videos: the speaker's face,
  // what the app does (tag) and what they say, word by word.
  const sayCaption = (parent, s, box) => {
    const wrap = el(parent, 'abs', { left: px(box.x), top: px(box.y), width: px(box.w), textAlign: box.align })
    const row = el(wrap, '', { display: 'flex', alignItems: 'center', gap: px(box.size * 0.3), justifyContent: box.align === 'center' ? 'center' : 'flex-start' })
    const who = s.lines[0].who
    const face = character(row, s.cast[who].look, Math.round(box.size * 1.5))
    const tag = el(row, 'pill', { fontSize: px(box.sub * 0.85), padding: `${box.sub * 0.3}px ${box.sub * 0.65}px`, boxShadow: 'none' }, s.tag)
    const quotes = s.lines.map((line) => quote(wrap, line, { fontSize: px(box.size * (orient === 'landscape' ? 0.8 : 0.72)), marginTop: px(box.size * 0.3), fontWeight: 700 }))
    return {
      wrap,
      update(t) {
        const a = t - s.lead
        const p = back(ramp(t, 0.1, 0.5))
        set(face.svg, { s: 0.6 + 0.4 * p, o: clamp(p * 2) })
        face.update(t, levelOf(s.lines, who, a))
        const q = easeOut(ramp(t, 0.25, 0.45))
        set(tag, { x: (1 - q) * -30, o: q })
        const current = lineAt(s.lines, a)
        quotes.forEach((item, i) => {
          item.node.style.display = s.lines[i] === current ? 'block' : 'none'
          item.update(a)
        })
      },
    }
  }

  const background = () => {
    const bg = el(document.getElementById('stage'), 'bg')
    return (t) => {
      const a = 30 + Math.sin(t * 0.35) * 8, b = 70 + Math.cos(t * 0.27) * 8
      bg.style.background = `radial-gradient(circle at ${b}% ${a}%, rgba(250, 204, 21, 0.28), transparent 38%), radial-gradient(circle at ${a}% ${b + 10}%, rgba(253, 230, 138, 0.35), transparent 42%), #fbfaf7`
    }
  }

  // Scene builders: each returns update(t) for t in seconds since its start.
  const builders = {
    title(root, s) {
      const box = L().cap
      const size = orient === 'landscape' ? 96 : orient === 'square' ? 80 : 98
      const wrap = el(root, 'abs', { left: px(orient === 'landscape' ? 200 : 80), width: px(W - (orient === 'landscape' ? 400 : 160)), top: '50%', textAlign: 'center' })
      const h = el(wrap, 'headline', { fontSize: px(size) })
      const ws = words(h, s.text.title)
      const sub = el(wrap, 'sub tag', { fontSize: px(size * 0.5), marginTop: px(size * 0.45) }, s.text.sub)
      return (t) => {
        wrap.style.transform = `translateY(-50%) scale(${1 + t * 0.012})`
        ws.forEach((w, i) => { const p = back(ramp(t, 0.1 + i * 0.07, 0.4)); set(w, { y: (1 - p) * 60, o: clamp(p * 1.4) }) })
        const p = easeOut(ramp(t, 0.35 + ws.length * 0.07, 0.5)); set(sub, { y: (1 - p) * 30, o: p })
      }
    },
    // A Shorts opener: the real screens cut fast under the hook line, with the
    // brand on top. Something is on screen from frame 0, since a feed's
    // autoplay (and its thumbnail) starts there.
    hook(root, s) {
      const top = el(root, 'abs', { left: 0, width: px(W), top: px(110), display: 'flex', justifyContent: 'center' })
      const badge = el(top, 'pill', { fontSize: px(38), padding: '12px 30px 12px 14px', gap: px(16), background: '#fff', color: '#0c0a09', boxShadow: '0 12px 30px rgba(41, 37, 36, 0.14)' })
      const logo = img(badge, config.logo, { width: px(58), height: px(58), borderRadius: '22%' })
      el(badge, '', {}, 'Catat Saja')
      const wrap = el(root, 'abs', { left: px(70), width: px(W - 140), top: px(230), textAlign: 'center' })
      const ws = words(el(wrap, 'headline', { fontSize: px(84) }), s.text.title)
      const pw = 700
      const phone = makePhone(root, s.shots.map((name) => `${config.shots}${name}.png`), pw)
      phone.node.style.left = px((W - pw) / 2); phone.node.style.top = px(700)
      const chip = el(root, 'abs pill', { fontSize: px(44), padding: '16px 40px', top: px(640), left: px(W / 2), transformOrigin: '50% 50%' })
      // Each screen once, over however long the line runs.
      const step = s.d / s.shots.length
      return (t) => {
        set(badge, { s: 0.9 + 0.1 * back(ramp(t, 0, 0.4)) })
        // The first word is already half in on frame 0.
        ws.forEach((w, i) => { const p = back(ramp(t, -0.15 + i * 0.06, 0.35)); set(w, { y: (1 - p) * 50, o: clamp(p * 1.4) }) })
        const n = Math.floor(t / step), local = t - n * step, k = n % s.shots.length
        phone.imgs.forEach((image, i) => { image.style.opacity = i === k ? 1 : 0 })
        // A small punch-in on every cut.
        const punch = 1 - easeOut(ramp(local, 0, 0.25))
        set(phone.node, { s: 1 + 0.035 * punch, r: -2 + (n % 2 ? 1 : 0), y: -t * 8 })
        chip.textContent = s.text.chips[k % s.text.chips.length]
        set(chip, { x: -chip.offsetWidth / 2 + (n % 2 ? 120 : -120), s: 0.85 + 0.15 * back(ramp(local, 0, 0.3)), r: n % 2 ? 3 : -3 })
        logo.style.transform = `rotate(${(1 - easeOut(ramp(t, 0, 0.5))) * -12}deg)`
      }
    },
    brand(root, s) {
      const size = orient === 'landscape' ? 220 : 260
      const wrap = el(root, 'abs', { left: 0, width: px(W), top: '50%', textAlign: 'center' })
      const logo = img(wrap, config.logo, { width: px(size), height: px(size), display: 'block', margin: '0 auto' })
      logo.className = 'logo'
      const name = el(wrap, 'headline', { fontSize: px(size * 0.5), marginTop: px(size * 0.22) }, s.text.title)
      const sub = el(wrap, 'sub', { fontSize: px(size * 0.2), marginTop: px(size * 0.08) }, s.text.sub)
      return (t) => {
        wrap.style.transform = 'translateY(-50%)'
        const p = back(ramp(t, 0.05, 0.6)); set(logo, { s: 0.4 + 0.6 * p, o: clamp(p * 2), r: (1 - p) * -12 })
        const q = easeOut(ramp(t, 0.35, 0.5)); set(name, { y: (1 - q) * 40, o: q })
        const r = easeOut(ramp(t, 0.6, 0.5)); set(sub, { y: (1 - r) * 30, o: r })
      }
    },
    // A story's opening in its place: the person acting it out, what the
    // app does and what they say below.
    place(root, s) {
      const height = Math.round(H * 0.64)
      const scene = placeBand(root, s, 'full', height)
      const cap = placeCaption(root, s, { x: 70, y: height + 10, w: W - 140, size: orient === 'portrait' ? 60 : 50, sub: 40 })
      const who = s.lines[0].who
      return (t) => {
        scene.update(t, levelOf(s.lines, who, t - s.lead))
        cap.update(t)
      }
    },
    phone(root, s) {
      const l = L()
      // After a place's opening, the place stays on as a band at the top,
      // the person still acting, over the phone and cards.
      const band = s.place && Math.round(H * 0.3)
      const scene = band && placeBand(root, s, 'strip', band)
      const cap = band ? placeCaption(root, s, { ...l.cap, y: band - 10, size: 50 }) : s.lines ? sayCaption(root, s, l.cap) : caption(root, s.text, l.cap)
      const srcs = s.shots.map((name) => `${config.shots}${name}.png`)
      // A spoken caption is taller: the phone and cards sit lower.
      const drop = band ? band + 310 - l.phone.y : s.lines && orient !== 'landscape' ? (orient === 'portrait' ? 110 : 50) : 0
      let pw = l.phone.w, px0 = l.phone.x, py0 = l.phone.y + drop
      if (s.desk && orient === 'landscape') { pw = 320; px0 = 700; py0 = 360 }
      const phone = makePhone(root, srcs, pw)
      if (orient === 'landscape' && !s.desk) py0 = (H - phone.h) / 2 + 10
      phone.node.style.left = px(px0); phone.node.style.top = px(py0)
      if (orient === 'landscape') { cap.wrap.style.top = '50%'; cap.wrap.style.transform = 'translateY(-50%)' }
      let browser
      if (s.desk && orient === 'landscape') {
        const bw = 1120
        browser = el(root, 'abs browser', { left: px(760), top: px((H - (bw * 0.625 + 44)) / 2), width: px(bw) })
        const bar = el(browser, 'bar')
        ;['#f87171', '#fbbf24', '#4ade80'].forEach((c) => el(bar, 'dot', { background: c }))
        el(bar, 'url', {}, '🔒&nbsp; catatsaja.ardeman.com')
        img(browser, `${config.shots}${s.desk}.png`)
        cap.wrap.style.width = px(560)
        cap.wrap.style.left = px(100)
        phone.node.style.left = px(660); phone.node.style.top = px(H - phone.h - 50)
        root.appendChild(phone.node)
      }
      const crops = (s.crops ?? []).map((c) => {
        const w = c.w ?? l.crop.w
        // dy: a second card lower down, in px of a 1920 px tall video.
        const top = (c.y ?? (band ? band + 440 : l.crop.y + drop)) + ((c.dy ?? 0) * H) / 1920
        const node = el(root, 'abs crop', { width: px(w), left: px(c.x ?? l.crop.x), top: px(top), transformOrigin: '50% 50%' })
        const image = img(node, `${config.shots}${c.shot}.png`)
        const maxH = H - top - (orient === 'portrait' ? 70 : 50)
        // Tall cards shrink to fit above the bottom edge, keeping the
        // centre where the full width would put it.
        fitters.push(() => {
          const fit = Math.min(w, (maxH * image.naturalWidth) / image.naturalHeight)
          node.style.width = px(fit)
          node.style.left = px((c.x ?? l.crop.x) + (w - fit) / 2)
        })
        return { node, at: c.at ?? 1.1, r: c.r ?? -2 }
      })
      return (t, d) => {
        cap.update(t)
        if (scene) scene.update(t, levelOf(s.lines, s.lines[0].who, t - s.lead))
        const p = easeOut(ramp(t, 0.05, 0.7))
        set(phone.node, { y: (1 - p) * 160 - t * 6, o: clamp(p * 1.5), s: 1 + t * 0.006, r: orient === 'landscape' ? 0 : (1 - p) * 4 })
        if (browser) { const b = easeOut(ramp(t, 0, 0.7)); set(browser, { x: (1 - b) * 120, o: b, s: 1 + t * 0.004 }) }
        if (phone.imgs.length > 1) {
          const swap = s.swap ?? d * 0.5
          const q = ramp(t, swap, 0.35)
          phone.imgs[1].style.opacity = q
        }
        crops.forEach((c) => {
          const q = back(ramp(t, c.at, 0.55))
          set(c.node, { y: (1 - q) * 120 - (t - c.at) * 5, s: 0.82 + 0.18 * q, o: clamp(q * 1.6), r: c.r * q })
        })
      }
    },
    phones(root, s) {
      const l = L()
      const cap = s.lines ? sayCaption(root, s, l.cap) : caption(root, s.text, l.cap)
      if (orient === 'landscape') { cap.wrap.style.top = '50%'; cap.wrap.style.transform = 'translateY(-50%)' }
      const w = orient === 'landscape' ? 380 : orient === 'square' ? 380 : 470
      const ph = s.shots.map((name, i) => {
        const p = makePhone(root, [`${config.shots}${name}.png`], w)
        const gap = 40
        const total = w * 2 + gap
        const left = orient === 'landscape' ? 1000 + i * (w + gap) : (W - total) / 2 + i * (w + gap)
        const top = orient === 'landscape' ? (H - p.h) / 2 : l.phone.y + (orient === 'square' ? 20 : 120) + (i ? 60 : 0) + (s.lines ? (orient === 'square' ? 40 : 60) : 0)
        p.node.style.left = px(left); p.node.style.top = px(top)
        // Whose phone it is, on a tag at its top.
        if (s.labels) el(p.node, 'pill', { position: 'absolute', left: '50%', top: px(-w * 0.07), transform: 'translateX(-50%)', fontSize: px(w * 0.065), padding: `${w * 0.018}px ${w * 0.05}px` }, s.labels[i])
        return p
      })
      return (t) => {
        cap.update(t)
        ph.forEach((p, i) => { const q = easeOut(ramp(t, 0.1 + i * 0.25, 0.7)); set(p.node, { y: (1 - q) * 160, o: clamp(q * 1.5), r: (i ? 3 : -3) * q }) })
      }
    },
    // Meet the people of a story: their faces, names and what they do, and
    // what they say, word by word, the speaker's mouth moving with it.
    person(root, s) {
      const many = s.people.length > 1
      const portrait = orient === 'portrait', landscape = orient === 'landscape'
      const size = landscape ? (many ? 400 : 520) : portrait ? (many ? 440 : 600) : many ? 360 : 460
      const faces = el(root, 'abs', { display: 'flex', gap: px(size * 0.08), justifyContent: 'center',
        ...(landscape ? { left: px(80), width: px(860), top: '50%' } : { left: 0, width: px(W), top: px(portrait ? 260 : 110) }) })
      const people = s.people.map((key) => ({ key, face: character(faces, s.cast[key].look, size) }))
      const text = el(root, 'abs', landscape
        ? { left: px(1000), width: px(800), top: '50%', textAlign: 'left' }
        : { left: px(80), width: px(W - 160), top: px((portrait ? 260 : 110) + size + (portrait ? 70 : 50)), textAlign: 'center' })
      const fs = landscape ? 64 : portrait ? 72 : 60
      const name = el(text, 'headline', { fontSize: px(fs * 1.1) }, s.people.map((key) => s.cast[key].name).join(' & '))
      const role = el(text, 'sub tag', { fontSize: px(fs * 0.5), marginTop: px(fs * 0.15) }, s.role)
      const quotes = s.lines.map((line) => {
        const box = el(text, '', { marginTop: px(fs * 0.6) })
        if (many) el(box, 'sub', { fontSize: px(fs * 0.42), fontWeight: 700, color: '#a16207', marginBottom: px(fs * 0.12) }, s.cast[line.who].name)
        const q = quote(box, line, { fontSize: px(fs * 0.72), fontWeight: 700 })
        return { box, update: q.update }
      })
      return (t) => {
        const a = t - s.lead
        if (landscape) { faces.style.transform = 'translateY(-50%)'; text.style.transform = 'translateY(-50%)' }
        const current = lineAt(s.lines, a)
        people.forEach(({ key, face }, i) => {
          const p = back(ramp(t, 0.05 + i * 0.15, 0.6))
          const speaking = current.who === key ? 1 : 0
          set(face.svg, { s: (0.5 + 0.5 * p) * (many ? 0.94 + speaking * 0.06 : 1), o: clamp(p * 2) * (many ? 0.75 + speaking * 0.25 : 1) })
          face.update(t, levelOf(s.lines, key, a))
        })
        const q = easeOut(ramp(t, 0.3, 0.5)); set(name, { y: (1 - q) * 30, o: q })
        const r = easeOut(ramp(t, 0.45, 0.5)); set(role, { y: (1 - r) * 24, o: r })
        quotes.forEach((item, i) => {
          item.box.style.display = s.lines[i] === current ? 'block' : 'none'
          item.update(a)
        })
      }
    },
    cta(root, s) {
      const size = orient === 'landscape' ? 170 : 220
      const wrap = el(root, 'abs', { left: 0, width: px(W), top: '50%', textAlign: 'center' })
      const logo = img(wrap, config.logo, { width: px(size), height: px(size), display: 'block', margin: '0 auto' })
      logo.className = 'logo'
      const name = el(wrap, 'headline', { fontSize: px(size * 0.42), marginTop: px(size * 0.2) }, 'Catat Saja')
      const title = el(wrap, 'headline', { fontSize: px(size * 0.36), marginTop: px(size * 0.12), color: '#44403c', fontWeight: 700 }, s.text.title)
      const pillWrap = el(wrap, '', { marginTop: px(size * 0.24) })
      const pill = el(pillWrap, 'pill', { fontSize: px(size * 0.2), padding: `${size * 0.09}px ${size * 0.2}px` }, s.text.url)
      const sub = el(wrap, 'sub', { fontSize: px(size * 0.14), marginTop: px(size * 0.22) }, s.text.sub)
      return (t) => {
        wrap.style.transform = 'translateY(-50%)'
        const p = back(ramp(t, 0.05, 0.6)); set(logo, { s: 0.5 + 0.5 * p, o: clamp(p * 2) })
        const q = easeOut(ramp(t, 0.3, 0.5)); set(name, { y: (1 - q) * 30, o: q })
        const r = easeOut(ramp(t, 0.5, 0.5)); set(title, { y: (1 - r) * 30, o: r })
        const u = back(ramp(t, 0.8, 0.55)); set(pill, { s: (0.7 + 0.3 * u) * (1 + 0.025 * Math.sin(Math.max(0, t - 1.4) * 4)), o: clamp(u * 2) })
        const v = easeOut(ramp(t, 1.1, 0.5)); set(sub, { o: v, y: (1 - v) * 20 })
      }
    },
  }

  window.setup = async (cfg) => {
    config = cfg
    W = cfg.width; H = cfg.height
    orient = W > H ? 'landscape' : W === H || H / W < 1.4 ? 'square' : 'portrait'
    const stage = document.getElementById('stage')
    const bg = background()
    let start = 0
    scenes = cfg.scenes.map((s, index) => {
      const root = el(stage, 'scene')
      // How far a scene's animation time runs ahead of its audio (scenes
      // after the first start animating as they fade in).
      s.lead = index === 0 ? 0 : FADE
      s.cast = cfg.cast
      const update = builders[s.type](root, s)
      const scene = { root, update, start, d: s.d }
      start += s.d
      return scene
    })
    scenes.bg = bg
    await document.fonts.ready
    await Promise.all([...document.images].map((i) => (i.complete ? null : new Promise((r) => { i.onload = r; i.onerror = r }))))
    fitters.forEach((fit) => fit())
    return start
  }

  // Scenes cross-fade over FADE seconds at each boundary.
  const FADE = 0.35
  window.seek = (t) => {
    scenes.bg(t)
    scenes.forEach((s, i) => {
      const local = t - s.start
      const last = i === scenes.length - 1
      const visible = local > -FADE && (last || local < s.d)
      s.root.style.display = visible ? 'block' : 'none'
      if (!visible) return
      const fadeIn = i === 0 ? 1 : ramp(local, -FADE, FADE)
      const fadeOut = last ? 1 : 1 - ramp(local, s.d - FADE, FADE)
      s.root.style.opacity = Math.min(fadeIn, fadeOut)
      const exit = last ? 0 : ramp(local, s.d - FADE, FADE)
      s.root.style.transform = `translateY(${-exit * 40}px)`
      // Its animations start with the fade-in, so no frame is empty.
      s.update(Math.max(0, local + (i === 0 ? 0 : FADE)), s.d + (i === 0 ? 0 : FADE))
    })
  }
</script>
</body>
</html>
