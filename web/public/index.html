<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pamer Studio</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <h1>Pamer Studio</h1>
    <span id="who"></span>
    <button id="signout" hidden>Sign out</button>
  </header>
  <main>
    <section id="signin" hidden>
      <p>The marketing plans, campaign links and media for every project.</p>
      <button id="google">Sign in with Google</button>
      <p id="denied" class="note" hidden>This account has no access.</p>
    </section>
    <section id="app" hidden>
      <nav id="projects"></nav>
      <nav id="views">
        <button data-view="plan" class="on">Plan</button>
        <button data-view="media">Media</button>
      </nav>
      <div id="plan"></div>
      <div id="media" hidden></div>
    </section>
  </main>
</body>
</html>
